name: Verificación
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rastreo_test
          POSTGRES_USER: rastreo
          POSTGRES_PASSWORD: test_only_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rastreo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Verificar PostgreSQL real
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://rastreo:test_only_ci@localhost:5432/rastreo_test
